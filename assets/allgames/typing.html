<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Typing Speed Test | Chaitanya Gaming Zone</title>

<link rel="stylesheet" href="../../game-style.css">
<link rel="stylesheet" href="../../style.css">

</head>

<body>

<header class="topbar">

<a href="../../index.html" class="back-btn">
🏠 Back Home
</a>

<h2>🎮 Chaitanya Gaming Zone</h2>

</header>

<div class="game-container">

<div class="game-banner">

<img src="../games/typing.png" alt="Typing Speed">

</div>

<div class="game-card">

<h1>⌨️ Typing Speed Test</h1>

<p>

Type the sentence exactly as shown to test your typing speed.

</p>

<br>

<div id="typingSentence" class="typing-box">

Click <b>Start Game</b> to begin...

</div>

<br>

<textarea

id="typingInput"

placeholder="Start typing here..."

rows="5"

spellcheck="false">

</textarea>

<br><br>

<div style="display:flex;gap:15px;flex-wrap:wrap;">

<button id="startTyping">

▶ Start Game

</button>

<button id="checkTyping">

✅ Check Result

</button>

</div>

<br>

<p id="typingResult"></p>

</div>

</div>

<script src="../../typing.js"></script>

</body>
