<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quick Math Rush | Chaitanya Gaming Zone</title>

<link rel="stylesheet" href="../../game-style.css">
<link rel="stylesheet" href="../../style.css">

</head>

<body>

<header class="topbar">

<a href="../../index.html" class="back-btn">
🏠 Back Home
</a>

<h2>🎮 Chaitanya Gaming Zone</h2>

</header>

<div class="game-container">

<div class="game-banner">

<img src="../games/math.png" alt="Quick Math Rush">

</div>

<div class="game-card">

<h1>🧮 Quick Math Rush</h1>

<p>

Solve the math question before the timer ends.

</p>

<br>

<h2 id="mathQ" class="math-question">

Press Start Game

</h2>

<br>

<h3 id="mathTimer">

Time: 5s

</h3>

<br>

<input

type="number"

id="mathInput"

placeholder="Enter your answer"

autocomplete="off">

<br><br>

<div style="display:flex;gap:15px;flex-wrap:wrap;">

<button id="startMath">

▶ Start Game

</button>

<button id="checkMath">

✅ Check Answer

</button>

</div>

<br>

<p id="mathResult"></p>

</div>

</div>

<script src="../../math.js"></script>

</body>

</html>
