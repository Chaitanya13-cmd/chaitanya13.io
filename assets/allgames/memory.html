<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Memory Flash | Chaitanya Gaming Zone</title>

<link rel="stylesheet" href="../../game-style.css">
<link rel="stylesheet" href="../../style.css">

</head>

<body>

<header class="topbar">

<a href="../../index.html" class="back-btn">
🏠 Back Home
</a>

<h2>🎮 Chaitanya Gaming Zone</h2>

</header>

<div class="game-container">

<div class="game-banner">

<img src="../games/memorygamebanner.png" alt="Memory Flash">

</div>

<div class="game-card">

<h1>🧠 Memory Flash</h1>

<p>
Memorize the emoji sequence and type it exactly to level up.
</p>

<br>

<h3>

⭐ Level :
<span id="level">1</span>

&nbsp;&nbsp;&nbsp;

🏆 Best :
<span id="best">1</span>

</h3>

<br>

<div class="xp-bar">

<div id="bar"></div>

</div>

<br>

<button id="startMemory">

▶ Start Game

</button>

<br><br>

<div id="memoryDisplay" class="memory-display">

❓ ❓ ❓

</div>

<br>

<input

type="text"

id="memoryInput"

placeholder="Type emojis here..."

autocomplete="off">

<br><br>

<button id="checkMemory">

✅ Check Answer

</button>

<br><br>

<p id="memoryResult"></p>

</div>

</div>

<script src="../../memory.js"></script>

</body>
